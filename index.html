<html lang="tr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nöbet Arası</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1a2a">
<script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1a2a;--panel:#18273b;--line:#2a3d57;--text:#e3e9f0;--mute:#8da0b6;--lamp:#f0c24b;--lamp-ink:#1d1606;--mine:#244466;--danger:#e0786a;
--head:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Source Sans 3",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg:#eef2f6;--panel:#ffffff;--line:#cfd9e4;--text:#14202f;--mute:#5b6e84;--lamp:#c98f00;--lamp-ink:#ffffff;--mine:#d8e6f4;--danger:#b2432f}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.45 var(--body)}
button,input{font:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

.auth{min-height:100%;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--lamp);border-radius:12px;padding:24px}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:36px;height:36px;flex:none}
.logo h1{margin:0;font:700 30px/1 var(--head)}
.card>p{color:var(--mute);margin:8px 0 18px;font-size:15px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px;cursor:pointer}
.tabs button[aria-pressed="true"]{border-color:var(--lamp);background:rgba(127,150,180,.15);font-weight:600}
.card label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
.card input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.hint{font-size:13px;color:var(--mute);margin-top:4px}
.go{width:100%;margin-top:16px;background:var(--lamp);color:var(--lamp-ink);border:0;border-radius:10px;padding:11px;font:700 19px var(--head);cursor:pointer}
.go:disabled{opacity:.6;cursor:default}
.err{color:var(--danger);font-size:14px;margin-top:10px;min-height:20px}

.app{display:grid;grid-template-columns:290px minmax(0,1fr);height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.brand{padding:20px 18px 14px;border-bottom:3px solid var(--lamp)}
.brand p{margin:6px 0 0;color:var(--mute);font-size:14px}
.q{margin:10px 10px 0;width:calc(100% - 20px);background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.rooms{flex:1;overflow:auto;padding:8px}
.room{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--text);padding:10px 12px;cursor:pointer;border-radius:0 8px 8px 0}
.room:hover{background:rgba(127,150,180,.12)}
.room[aria-current="true"]{border-left-color:var(--lamp);background:rgba(127,150,180,.18)}
.room b{display:block;font-weight:600}
.room span{color:var(--mute);font-size:13px}
main{display:flex;flex-direction:column;min-height:0;min-width:0}
.top{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap}
.top h2{margin:0;font:700 26px/1 var(--head)}
.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.tools b{color:var(--lamp);font-weight:600}
.tools button{background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:14px}
.desc{width:100%;margin:0;color:var(--mute);font-size:14px}
.log{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:flex-end}
.row.mine{flex-direction:row-reverse}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 16px var(--head);color:#10151d}
.msg{max-width:min(560px,82%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.row.mine .msg{background:var(--mine)}
.who{font-weight:600;font-size:14px;color:var(--lamp)}
.who span{color:var(--mute);font-size:12px;margin-left:8px;font-weight:400}
.msg p{margin:2px 0 0;overflow-wrap:anywhere;white-space:pre-wrap}
.acts{margin-top:4px;display:none;gap:12px}
.msg:hover .acts,.msg:focus-within .acts{display:flex}
.acts button{background:none;border:0;color:var(--mute);font-size:13px;padding:2px 0;cursor:pointer;text-decoration:underline}
.acts button:hover,.acts button:focus-visible{color:var(--danger)}
.note{align-self:center;color:var(--mute);font-size:13px;text-align:center;max-width:460px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:14px;z-index:5}
form.send{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel)}
form.send input{flex:1;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
form.send button{background:var(--lamp);color:var(--lamp-ink);border:0;border-radius:10px;padding:0 18px;font:700 18px var(--head);cursor:pointer}
