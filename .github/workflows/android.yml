name: Android derleme

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Android SDK kur
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;35.0.0 platforms;android-35"

      - name: Bubblewrap kur
        run: npm install -g @bubblewrap/cli

      - name: Bubblewrap ayari
        run: |
          if [ ! -e "$ANDROID_HOME/tools" ]; then
            ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          fi
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Imza anahtari uret
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "HATA: KEYSTORE_PASSWORD gizli anahtari yok"; exit 1; fi
          keytool -genkeypair -v -keystore android.keystore -alias nobetarasi \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=Nobet Arasi, O=Nobet Arasi, C=TR"

      - name: Projeyi uret ve derle
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json 2>&1 | tee ../update.log
          bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json 2>&1 | tee ../build.log
          keytool -list -v -keystore android.keystore -alias nobetarasi -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" | grep -E "SHA1|SHA256" | tee sha.txt
          ls -la

      - name: HATA OZETI
        if: failure()
        run: |
          echo "===== build.log icinde hata satirlari ====="
          grep -n -i -E "what went wrong|FAILURE:|error:|Caused by|not found|cannot|could not|Execution failed" build.log | head -40 || true
          echo "===== build.log son 25 satir (stack haric) ====="
          grep -v -E "^\s+at " build.log | tail -25 || true

      - name: Ciktilari yukle
        uses: actions/upload-artifact@v4
        with:
          name: nobet-arasi-android
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
            android/android.keystore
            android/sha.txt
